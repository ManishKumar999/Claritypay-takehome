name: claritypay-takehome

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claritypay
      POSTGRES_USER: claritypay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - claritypay_data:/var/lib/postgresql/data
      - ./data:/assignment-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claritypay -d claritypay"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  claritypay_data:
